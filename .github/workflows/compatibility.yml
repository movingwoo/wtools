name: Minimum browser compatibility

on:
  schedule:
    # 매주 월요일 04:20 KST
    - cron: '20 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # Keep Chromium and WebKit near their baseline; Firefox needs module Workers.
        include:
          - browser: chromium
            playwright: 1.32.3
            image: mcr.microsoft.com/playwright:v1.32.3-jammy@sha256:821472c31a97a7ccfc4dd4ab80c52b9239c467280287a60193498180fdc5ce97
          - browser: firefox
            playwright: 1.36.0
            image: mcr.microsoft.com/playwright:v1.36.0-jammy@sha256:3d3619bf5e622d264f519bffd3aa321d061bf420688eda8a5143da7884b36a6b
          - browser: webkit
            playwright: 1.32.3
            image: mcr.microsoft.com/playwright:v1.32.3-jammy@sha256:821472c31a97a7ccfc4dd4ab80c52b9239c467280287a60193498180fdc5ce97

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Check baseline syntax and APIs
        run: node scripts/check_browser_compat.mjs

      - name: Install matching legacy test driver without downloading browsers
        working-directory: tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --ignore-scripts --force @playwright/test@${{ matrix.playwright }}

      - name: Run closest baseline engine
        working-directory: tests
        env:
          WTOOLS_BASELINE_BROWSER: ${{ matrix.browser }}
        run: npx playwright test --config=playwright.minimum.config.js
