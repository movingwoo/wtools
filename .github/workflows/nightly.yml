name: Nightly production and dependency check

# PR CI는 CDN 라이브러리를 캐시에서 읽는다(tests/cdn-cache.js). 덕분에 CDN이 잠깐
# 안 잡혀도 PR이 막히지 않지만, 대신 핀이 죽었거나 패키지가 내려간 경우를 못 잡는다.
# 운영 보안 헤더, 로컬 고정 ESM/WASM 원본과 실제 CDN을 하루 한 번 함께 검사한다.
# 실패는 PR을 막지 않고 여기서만 드러난다.

on:
  schedule:
    # 매일 03:00 KST (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check production security headers
        run: python3 scripts/check_security_headers.py

      - name: Verify vendored ESM and WASM sources
        run: python3 scripts/vendor_dependencies.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Verify Playwright starts and collects tests
        working-directory: tests
        timeout-minutes: 1
        run: npm run test:collect -- --project=chromium

      - name: Run browser tests against the real CDN
        working-directory: tests
        env:
          WTOOLS_LIVE_CDN: '1'
        run: npx playwright test --project=chromium

      - name: Write operations summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo '## W-Tools 운영 점검' >> "$GITHUB_STEP_SUMMARY"
          echo '- 보안 헤더와 로컬 고정 자산 원본 무결성' >> "$GITHUB_STEP_SUMMARY"
          echo '- 실제 CDN SRI 핀과 브라우저 전체 회귀' >> "$GITHUB_STEP_SUMMARY"
          echo '- PWA manifest·아이콘·시작 URL, sitemap·404 응답' >> "$GITHUB_STEP_SUMMARY"
