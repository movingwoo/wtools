name: Nightly live-CDN check

# PR CI는 CDN 라이브러리를 캐시에서 읽는다(tests/cdn-cache.js). 덕분에 CDN이 잠깐
# 안 잡혀도 PR이 막히지 않지만, 대신 핀이 죽었거나 패키지가 내려간 경우를 못 잡는다.
# 그 검증을 하루 한 번으로 옮긴다. 실패는 PR을 막지 않고 여기서만 드러난다.

on:
  schedule:
    # 매일 03:00 KST (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.50.1-noble@sha256:ac7053180325ef75d31774c458d0bb9b55ac153ae1be3d104b80c6c1bb6a067c
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Verify Playwright starts and collects tests
        working-directory: tests
        timeout-minutes: 1
        run: npm run test:collect -- --project=chromium

      - name: Run browser tests against the real CDN
        working-directory: tests
        env:
          WTOOLS_LIVE_CDN: '1'
        run: npx playwright test --project=chromium
