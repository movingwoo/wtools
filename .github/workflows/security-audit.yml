name: Daily dependency security audit

on:
  schedule:
    # 매일 03:23 KST
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit runtime and test dependency advisories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/audit_dependencies.py --fail-on-vulnerability | tee -a "$GITHUB_STEP_SUMMARY"
