name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --input-type=module --check < "$file"
          done < <(find js -name '*.js' -type f | sort)
          node --check sw.js

      - name: Validate registrations and static assets
        run: python3 scripts/validate_static.py

      - name: Check whitespace
        shell: bash
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD

      - name: Smoke-test app shell over HTTP
        shell: bash
        run: |
          python3 -m http.server 8000 > /tmp/wtools-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 scripts/validate_static.py --base-url http://127.0.0.1:8000

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Verify Playwright starts and collects tests
        working-directory: tests
        timeout-minutes: 1
        run: npm run test:collect -- --project=chromium

      # 도구가 지연 로드하는 CDN 라이브러리를 실행 간에 재사용한다.
      # CDN이 잠깐 안 잡혀도 테스트가 죽지 않고, 캐시가 맞으면 네트워크를 아예 타지 않는다.
      - name: Restore CDN library cache
        uses: actions/cache@v4
        with:
          path: tests/.lib-cache
          key: cdn-libs-${{ hashFiles('js/**/*.js', 'index.html') }}
          restore-keys: cdn-libs-

      - name: Install Playwright Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: tests
        run: npx playwright test --project=chromium

  cross-browser-smoke:
    name: Cross-browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Verify Playwright starts and collects tests
        working-directory: tests
        timeout-minutes: 1
        run: npm run test:collect -- --project=${{ matrix.browser }}

      # 병렬 잡이 같은 캐시 키를 동시에 저장하지 않도록 브라우저별 키를 사용한다.
      # 첫 실행에서는 기존 Chromium 캐시를 복원해 외부 CDN 요청을 최소화한다.
      - name: Restore CDN library cache
        uses: actions/cache@v4
        with:
          path: tests/.lib-cache
          key: cdn-libs-${{ matrix.browser }}-${{ hashFiles('js/**/*.js', 'index.html') }}
          restore-keys: |
            cdn-libs-${{ matrix.browser }}-
            cdn-libs-

      - name: Install Playwright ${{ matrix.browser }}
        working-directory: tests
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run cross-browser smoke tests
        working-directory: tests
        run: npx playwright test --project=${{ matrix.browser }}
