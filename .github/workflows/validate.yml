name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --input-type=module --check < "$file"
          done < <(find js -name '*.js' -type f | sort)
          node --check sw.js

      - name: Check minimum-browser compatibility
        run: |
          node --test scripts/test_check_browser_compat.mjs
          node scripts/check_browser_compat.mjs

      - name: Validate registrations and static assets
        run: |
          python3 scripts/check_markdown_specs.py
          python3 scripts/validate_static.py
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify static release archive
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/wtools-static-release"
          python3 scripts/build_static_release.py --version v0.0.0-ci --output-dir "$release_dir"
          python3 -m zipfile -e "$release_dir/wtools-v0.0.0-ci-static.zip" "$release_dir/extracted"
          python3 -m http.server 8001 --directory "$release_dir/extracted/wtools-v0.0.0-ci" > "$RUNNER_TEMP/wtools-release-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 scripts/validate_static.py --base-url http://127.0.0.1:8001

      - name: Check whitespace
        shell: bash
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD

      - name: Smoke-test app shell over HTTP
        shell: bash
        run: |
          python3 -m http.server 8000 > /tmp/wtools-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 scripts/validate_static.py --base-url http://127.0.0.1:8000

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --no-audit --no-fund

      - name: Verify Playwright starts and collects tests
        working-directory: tests
        timeout-minutes: 1
        run: npm run test:collect

      # 도구가 지연 로드하는 CDN 라이브러리를 실행 간에 재사용한다.
      # CDN이 잠깐 안 잡혀도 테스트가 죽지 않고, 캐시가 맞으면 네트워크를 아예 타지 않는다.
      - name: Restore CDN library cache
        uses: actions/cache@v6
        with:
          path: tests/.lib-cache
          key: cdn-libs-${{ hashFiles('js/**/*.js', 'index.html') }}
          restore-keys: cdn-libs-

      - name: Run Chromium full suite
        working-directory: tests
        run: npm test -- --project=chromium

      - name: Run Firefox smoke suite
        if: ${{ !cancelled() }}
        working-directory: tests
        run: npm test -- --project=firefox

      - name: Run WebKit smoke suite
        if: ${{ !cancelled() }}
        working-directory: tests
        run: npm test -- --project=webkit
